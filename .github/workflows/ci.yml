name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Executar testes
        run: go test ./...


  build:
  needs: test

  runs-on: ubuntu-latest

  steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Build Docker
      run: docker build -t ci-cd-pipeline .